name: Publicar en GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar dependencias del frontend
        working-directory: frontend
        run: npm install

      - name: Compilar sitio estático
        working-directory: frontend
        run: npm run build
        env:
          # Configura estas dos variables en:
          # Settings > Secrets and variables > Actions > Variables (del repo)
          # NEXT_PUBLIC_BACKEND_URL = la URL de tu backend en Railway
          NEXT_PUBLIC_BACKEND_URL: ${{ vars.NEXT_PUBLIC_BACKEND_URL }}
          NEXT_PUBLIC_BASE_PATH: /${{ github.event.repository.name }}

      - name: Evitar que GitHub Pages ignore carpetas como _next
        run: touch frontend/out/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
